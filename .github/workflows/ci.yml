name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test repository hygiene scanner
        run: ./tools/ci/secret_history_scan_test.sh

      - name: Run repository hygiene scan
        run: ./tools/ci/secret_history_scan.sh

  go-and-policy:
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Set up OPA
        env:
          OPA_VERSION: 1.18.2
        run: |
          opa_binary="${RUNNER_TEMP}/opa"
          opa_checksum="${opa_binary}.sha256"
          release_url="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"
          curl -fsSL "${release_url}/opa_linux_amd64_static" -o "${opa_binary}"
          curl -fsSL "${release_url}/opa_linux_amd64_static.sha256" -o "${opa_checksum}"
          expected_checksum="$(cut -d ' ' -f 1 "${opa_checksum}")"
          echo "${expected_checksum}  ${opa_binary}" | sha256sum --check -
          chmod +x "${opa_binary}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run policy tests
        run: opa test policy/core policy/domain policy/tests policy/data -v

  control-plane:
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run control-plane tests
        run: npm run test

      - name: Build control plane
        run: npm run build

  openclaw-plugin:
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
    defaults:
      run:
        working-directory: integrations/openclaw-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/openclaw-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run plugin tests
        run: npm test

      - name: Run package smoke check
        run: npm run pack:check

  pi-extension:
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
    defaults:
      run:
        working-directory: integrations/pi-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19
          cache: npm
          cache-dependency-path: integrations/pi-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run extension tests
        run: npm test

      - name: Run package smoke check
        run: npm run pack:check

  bundle-smoke:
    runs-on: ubuntu-latest
    needs:
      - control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run OPA bundle smoke test
        run: ./tools/ci/opa_bundle_smoke.sh
